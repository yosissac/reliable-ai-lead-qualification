name: Bug report
description: Report reproducible incorrect behavior using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, private execution exports, or exploitable vulnerability details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node, Docker, Compose, n8n, and PostgreSQL versions as relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use the smallest synthetic example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence class
      options:
        - Static inspection
        - Deterministic test or simulator
        - Local live execution
        - External test integration
        - Production deployment
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, account identifiers, and personal/customer data.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
